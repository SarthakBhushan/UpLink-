spring.data.mongodb.uri=${MONGO_URI}
server.servlet.context-path=/api/v1.0
spring.data.mongodb.auto-index-creation=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
clerk.issuer=${CLERK_ISSUER}
clerk.jwks-url=${CLERK_JWKS_URL}
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET}

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# AWS S3 / Cloudflare R2 / Backblaze B2 / LocalStack configuration
aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:test}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.s3.bucket=${AWS_S3_BUCKET:uplink-bucket}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access=${AWS_S3_PATH_STYLE:true}

# Ollama local AI configuration (used for embeddings + local fallback completion)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model.chat=${OLLAMA_MODEL_CHAT:qwen2.5:1.5b}
ollama.model.embedding=${OLLAMA_MODEL_EMBEDDING:nomic-embed-text}

# Groq Cloud LLM configuration (primary completion engine when deployed)
# Get free key at: https://console.groq.com
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama3-8b-8192}

server.port=${PORT:8081}
